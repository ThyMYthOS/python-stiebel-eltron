name: Release to PyPI

# Trigger the workflow on new tag creation
on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v0.1.1, etc.

permissions:
  contents: read

jobs:
  test:
    name: Run the checks
    uses: ./.github/workflows/test-python-package.yml

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # A tag on a commit that is not on master publishes whatever that commit
    # holds under the new version number, and PyPI takes a version only once.
    - name: Check that the tag is on master and names the package version
      run: |
        git fetch --no-tags origin master:refs/remotes/origin/master
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
          echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on master"
          exit 1
        fi
        version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' pystiebeleltron/__init__.py)
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not name the package version $version"
          exit 1
        fi

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

    - name: Build distributions
      run: uv build

    - name: Verify build artifacts
      run: |
        echo "Built packages:"
        ls dist/

    - name: Upload distributions
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/pystiebeleltron
    permissions:
      id-token: write  # Required for OIDC trusted publishing

    steps:
    - name: Download distributions
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
